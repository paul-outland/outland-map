<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Outland — Radial Structure Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { height: 100%; margin: 0; background:#f5f5f5; }
    #chart { width: 100vw; height: 100vh; touch-action: none; }
    * { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }

    /* --- Minimal UI --- */
    .ui {
      position: fixed; right: 14px; top: 14px; z-index: 20;
      display: flex; gap: .5rem; align-items: center;
    }
    .home-btn {
      padding: .45rem .75rem;
      border: 1px solid #d0d0d0; border-radius: 10px; background:#fff;
      font-size: 14px; cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.05);
    }

    /* Floating project picker */
    .picker-wrap { position: relative; }
    .picker-toggle {
      width: 38px; height: 38px; border-radius: 50%;
      border: 1px solid #d0d0d0; background: #fff; cursor: pointer;
      display: grid; place-items: center; box-shadow: 0 2px 10px rgba(0,0,0,.06);
      transition: transform .28s ease;
    }
    .picker-toggle .plus {
      width: 18px; height: 18px; position: relative;
    }
    .picker-toggle .plus::before,
    .picker-toggle .plus::after {
      content: ""; position: absolute; left: 50%; top: 50%;
      width: 2px; height: 18px; background: #333; transform: translate(-50%, -50%) rotate(0deg);
      transition: transform .28s ease;
    }
    .picker-toggle .plus::after { transform: translate(-50%, -50%) rotate(90deg); }
    .picker-wrap.open .picker-toggle .plus::before { transform: translate(-50%, -50%) rotate(45deg); }
    .picker-wrap.open .picker-toggle .plus::after  { transform: translate(-50%, -50%) rotate(-45deg); }

    .picker-panel {
      position: absolute; right: 0; top: 46px;
      background:#fff; border:1px solid #d0d0d0; border-radius:0;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      width: 260px; max-height: 60vh; overflow:auto; display:none;
    }
    .picker-wrap.open .picker-panel { display:block; }
    .picker-item {
      padding: .6rem .8rem; cursor:pointer; font-size: 14px; color:#222;
      border-bottom: 1px solid #f2f2f2;
    }
    .picker-item:hover { background:#f7f7f7; }

    @media (max-width:640px){
      .picker-panel { width: 85vw; }
      .home-btn { padding:.4rem .6rem; font-size:13px; }
    }
  </style>
  <script src="./echarts.min.js"></script>
</head>
<body>
  <div class="ui">
    <div class="picker-wrap" id="pickerWrap">
      <button class="picker-toggle" id="pickerToggle" aria-label="Jump to project">
        <span class="plus"></span>
      </button>
      <div class="picker-panel" id="pickerPanel">
        <div id="pickerItems"></div>
      </div>
    </div>
    <button class="home-btn" id="homeBtn" style="display:none">Home</button>
  </div>

  <div id="chart"></div>

  <script>
    const rows = [
      { project:"Conway Main House, Gatehouse", abbr:"Conway", pp:"Gina Johnston", pm:"Webster H", consultant:["Webster H"] },
      { project:"EMB & Ampitheatre", abbr:"EMB", pp:"Gina Johnston", pm:"Webster H", consultant:["Webster H"] },
      { project:"Guest Village", abbr:"Guest", pp:"Gina Johnston", pm:"Webster H", consultant:["Webster H"] },
      { project:"Pavilion and Tunnel", abbr:"Pavilion", pp:"Gina Johnston", pm:"Webster H", consultant:["Webster H"] },
      { project:"Conway Landscape", abbr:"Landscape", pp:"Gina Johnston", pm:"Webster H", consultant:["Webster H"] },
      { project:"Coast", abbr:"Coast", pp:"Chris Houck", pm:"John Martin", consultant:[] },
      { project:"Arc", abbr:"Arc", pp:"David Luxon", pm:"Jack Cowdrey", consultant:[] },
      { project:"130 Whitehall Court", abbr:"130 WHC", pp:"David Luxon", pm:"Jack Cowdrey", consultant:[] },
      { project:"80–81 Whitehall Court", abbr:"80–81 WHC", pp:"Carl Bignell", pm:"Jack Cowdrey", consultant:[] },
      { project:"Hollycombe House", abbr:"Hollycombe", pp:"David Luxon", pm:"Colliers", consultant:["Colliers"] },
      { project:"Hatch / Mill Farm", abbr:"Hatch", pp:"David Luxon", pm:"Cove", consultant:["Cove"] },
      { project:"The Old Stables", abbr:"Stables", pp:"David Luxon", pm:"Colliers", consultant:["Colliers"] },
      { project:"One Hyde Park", abbr:"OHP", pp:"Chris Houck", pm:"Colliers", consultant:["Colliers","Ben Robinson","Carl Bignell"] },
      { project:"Wapping", abbr:"Wapping", pp:"David Luxon", pm:"Jack Cowdrey", consultant:[] },
      { project:"Marylebone", abbr:"Marylebone", pp:"Gina Johnston", pm:"Jack Cowdrey", consultant:[] },
    ];

    const NEW_HIRES = new Set(["Jack Cowdrey","John Martin"]);
    const CONSULTANTS = new Set(["Webster H","Colliers","Cove"]);
    const COLORS = { bg:"#f5f5f5", hub:"#000", project:"#D3D3D3", emp:"#ffa077", new:"#fff", con:"#D3D3D3", border:"#333", link:"#c8c8c8" };

    function personType(name){
      if (NEW_HIRES.has(name)) return "new";
      if (CONSULTANTS.has(name)) return "con";
      return "emp";
    }
    function styleForPerson(name){
      const t = personType(name);
      if (t==="new") return {color:COLORS.new, borderColor:COLORS.border, borderWidth:2};
      if (t==="con") return {color:COLORS.con, borderColor:COLORS.con, borderWidth:2};
      return {color:COLORS.emp, borderColor:COLORS.emp, borderWidth:2};
    }

    const chart = echarts.init(document.getElementById("chart"), null, { renderer:"canvas" });

    function setHome(){
      const pieData = rows.map(r=>({name:r.abbr, value:1, itemStyle:{color:COLORS.project, borderColor:"#fff", borderWidth:2}, tooltip:{value:r.project}}));
      chart.clear();
      chart.setOption({
        backgroundColor:COLORS.bg,
        series:[{
          type:"pie", radius:["42%","82%"], center:["50%","50%"],
          label:{position:"inside", color:"#111", fontSize:13, formatter:"{b}"},
          data:pieData
        }],
        graphic:[
          {type:"circle", left:"center", top:"middle", shape:{r:90}, style:{fill:COLORS.hub}},
          {type:"text", left:"center", top:"middle", style:{text:"Outland.", fill:"#fff", fontSize:22, fontWeight:700, textAlign:"center"}}
        ],
        tooltip:{trigger:"item", formatter:p=>p.data?.tooltip?.value || p.name}
      });
      chart.off("click");
      chart.on("click",p=>{ if(p.seriesType==="pie") openProject(p.data.tooltip.value); });
      document.getElementById("homeBtn").style.display="none";
    }

    function openProject(projectName){
      const row = rows.find(r=>r.project===projectName);
      if(!row) return;
      const cx = chart.getWidth()/2, cy = chart.getHeight()/2;
      const nodes=[], links=[];
      nodes.push({
        id:"project", name:row.project, x:cx, y:cy,
        symbol:"circle", symbolSize:160,
        itemStyle:{color:COLORS.project, borderColor:COLORS.project},
        label:{show:true, position:"inside", color:"#111", fontSize:16, fontWeight:700}
      });

      const items=[
        {label:`Project Principal — ${row.pp}`, style:styleForPerson(row.pp)},
        {label:`Project Manager — ${row.pm}`, style:styleForPerson(row.pm)},
        ...(row.consultant||[]).map(n=>({label:`Consultant — ${n}`, style:styleForPerson(n)}))
      ];
      const radius=280, step=360/items.length;
      items.forEach((it,i)=>{
        const ang=(i*step-90)*Math.PI/180;
        const x=cx+Math.cos(ang)*radius, y=cy+Math.sin(ang)*radius;
        nodes.push({id:`n${i}`, name:it.label, x,y, symbol:"circle", symbolSize:130,
          itemStyle:it.style, label:{show:true, position:"inside", color:"#111", fontSize:14, fontWeight:600}});
        links.push({source:"project", target:`n${i}`, lineStyle:{color:COLORS.link, width:1.6}});
      });

      chart.clear();
      chart.setOption({
        backgroundColor:COLORS.bg,
        series:[{type:"graph", layout:"none", data:nodes, links, roam:true,
          lineStyle:{color:COLORS.link, width:1.6}, emphasis:{focus:"adjacency"}}],
        tooltip:{trigger:"item", formatter:p=>p.data?.name || ""}
      });
      chart.off("click");
      chart.on("click",p=>{ if(p.data?.id==="project") setHome(); });
      document.getElementById("homeBtn").style.display="inline-block";
    }

    const pickerWrap=document.getElementById("pickerWrap");
    const pickerToggle=document.getElementById("pickerToggle");
    const pickerPanel=document.getElementById("pickerPanel");
    const pickerItems=document.getElementById("pickerItems");
    const homeBtn=document.getElementById("homeBtn");

    rows.forEach(r=>{
      const d=document.createElement("div");
      d.className="picker-item"; d.textContent=r.project;
      d.addEventListener("click",()=>{pickerWrap.classList.remove("open");openProject(r.project);});
      pickerItems.appendChild(d);
    });
    pickerToggle.addEventListener("click",()=>pickerWrap.classList.toggle("open"));
    document.addEventListener("click",e=>{if(!pickerWrap.contains(e.target))pickerWrap.classList.remove("open");});
    homeBtn.addEventListener("click",()=>{pickerWrap.classList.remove("open");setHome();});

    setHome();
    window.addEventListener("resize",()=>chart.resize({animation:{duration:120}}),{passive:true});
    document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
  </script>
</body>
</html>
